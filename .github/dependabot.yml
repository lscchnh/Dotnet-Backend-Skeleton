version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      microsoft:
        patterns: ["Microsoft.*"]
      tests:
        patterns: ["MSTest*", "NSubstitute"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
